name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure remote MLflow (optional)
        run: |
          if [ -n "$MLFLOW_REMOTE_URI" ]; then
            echo "MLFLOW_TRACKING_URI=$MLFLOW_REMOTE_URI" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_USERNAME=$MLFLOW_REMOTE_USERNAME" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_PASSWORD=$MLFLOW_REMOTE_PASSWORD" >> "$GITHUB_ENV"
            echo "Remote MLflow enabled."
          else
            echo "Remote MLflow not configured; using local tracking."
          fi
        env:
          MLFLOW_REMOTE_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_REMOTE_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_REMOTE_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Authenticate to Cloud Storage
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Download current metrics for rollback check
        run: |
          mkdir -p outputs
          aws s3 cp "s3://${{ secrets.CLOUD_BUCKET }}/models/latest/metrics.json" outputs/previous_metrics.json || true

      - name: Train model
        run: python src/train.py

      - name: Compare with current model
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          previous_path = Path("outputs/previous_metrics.json")
          current = json.loads(Path("outputs/metrics.json").read_text())
          if previous_path.exists():
            previous = json.loads(previous_path.read_text())
            if current["accuracy"] < previous["accuracy"]:
              raise SystemExit(
                f"ROLLBACK: new accuracy {current['accuracy']:.4f} "
                f"< current accuracy {previous['accuracy']:.4f}"
              )
            print(
              f"PROMOTE: new accuracy {current['accuracy']:.4f} >= "
              f"current accuracy {previous['accuracy']:.4f}"
            )
          else:
            print("PROMOTE: no current metrics found; first model deployment")
          EOF

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import boto3
          import os

          boto3.client("s3").upload_file(
              "models/model.pkl",
              os.environ["CLOUD_BUCKET"],
              "models/latest/model.pkl",
          )
            boto3.client("s3").upload_file(
              "outputs/metrics.json",
              os.environ["CLOUD_BUCKET"],
              "models/latest/metrics.json",
            )
          print("Model uploaded to S3.")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

      - name: Save performance report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.68).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.68:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.68. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f}. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed."
            exit 1
